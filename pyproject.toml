[project]
name = "rag-health-assistant-for-diabetes-hypertension"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "google-genai>=2.19.0",
    "jinja2>=3.1.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "reportlab>=4.0.0",
    "requests>=2.34.2",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_health_assistant"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
]
